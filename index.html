<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- ⭐ 탭 기능을 작동시키기 위해 Bootstrap JS 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
      body { background-color: #f8f9fa; font-family: 'Malgun Gothic', sans-serif; padding: 20px; }
      .main-title { font-size: 1.4rem; font-weight: 800; color: #0d6efd; letter-spacing: -0.5px; }
      .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; border: none; background: white; padding: 20px;}
      .loader { display: none; border: 4px solid #f3f3f3; border-top: 4px solid #0d6efd; border-radius: 50%; width: 28px; height: 28px; animation: spin 1s linear infinite; margin: 10px auto; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      .result-box { white-space: pre-wrap; padding: 15px; border-radius: 8px; font-size: 0.95rem; display: none; line-height: 1.5; }
      .teacher-checkboxes { max-height: 250px; overflow-y: auto; border: 1px solid #dee2e6; padding: 12px; border-radius: 6px; background: #fff; }
      .class-btn { transition: all 0.2s; border: 1px solid #dee2e6; }
      .class-btn:hover { border-color: #0d6efd; background-color: #e9ecef; }
      .free-slot { background-color: #f1f3f5; color: #adb5bd; border: 1px dashed #dee2e6; }
    </style>
  </head>
  <body>
    <div class="container" style="max-width: 650px;">
      <h3 class="text-center mb-4 main-title">🏫 동명공업고등학교<br>교사 시간표 & 회의 시간 찾기 시스템</h3>
      
      <div class="d-flex justify-content-end mb-3">
        <button class="btn btn-outline-primary btn-sm fw-bold shadow-sm" onclick="openSheet()">📊 결과 시트 열기 (새 창)</button>
      </div>

      <!-- ⭐ 메인 탭 네비게이션 -->
      <ul class="nav nav-tabs mb-3" id="mainTab" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active fw-bold" id="timetable-tab" data-bs-toggle="tab" data-bs-target="#timetable-pane" type="button" role="tab">교사 시간표 & 교체</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link fw-bold" id="meeting-tab" data-bs-toggle="tab" data-bs-target="#meeting-pane" type="button" role="tab">회의 시간 찾기</button>
        </li>
      </ul>

      <!-- 메인 탭 콘텐츠 -->
      <div class="tab-content" id="mainTabContent">
        
        <!-- 1. 시간표 및 교체 찾기 탭 -->
        <div class="tab-pane fade show active" id="timetable-pane" role="tabpanel">
          <div class="card">
            <div class="d-flex align-items-end gap-2 mb-3">
              <div class="flex-grow-1">
                <label class="form-label text-muted small fw-bold">교사 선택</label>
                <select id="swapTeacher" class="form-select bg-light"></select>
              </div>
              <button class="btn btn-outline-secondary" style="width: 80px;" onclick="resetSwapTab()">초기화</button>
            </div>
            
            <!-- 시간표 출력 영역 -->
            <div id="timetableContainer" style="display: none;">
              <!-- 요일별 탭 버튼 -->
              <ul class="nav nav-pills nav-fill mb-3" id="dayTabs" role="tablist"></ul>
              <!-- 요일별 시간표 내용 -->
              <div class="tab-content" id="dayTabsContent"></div>
            </div>

            <!-- 교체 결과 영역 -->
            <div class="text-center mt-3"><div id="loader1" class="loader"></div></div>
            <div id="result1" class="result-box mt-3 shadow-sm"></div>
          </div>
        </div>

        <!-- 2. 회의 시간 찾기 탭 -->
        <div class="tab-pane fade" id="meeting-pane" role="tabpanel">
          <div class="card">
            <label class="form-label text-muted small fw-bold">회의 시간을 맞출 교사 선택 (2명 이상)</label>
            <div id="teacherCheckboxes" class="teacher-checkboxes mb-3 shadow-sm"></div>
            
            <div class="d-flex gap-2">
              <button class="btn btn-info text-white fw-bold flex-grow-1 shadow-sm" onclick="findFreeSlots()">회의 시간 조회하기</button>
              <button class="btn btn-outline-secondary" style="width: 80px;" onclick="resetFreeTab()">초기화</button>
            </div>
            
            <div class="text-center mt-3"><div id="loader2" class="loader"></div></div>
            <div id="result2" class="result-box mt-3 shadow-sm"></div>
          </div>
        </div>

      </div>
    </div>

    <script>
      window.appData = null; 
      window.sheetUrl = "";

      // 교시별 시간 매핑 데이터
      const periodTimes = {
        1: "08:50", 2: "09:50", 3: "10:50", 4: "11:50", 
        5: "13:30", 6: "14:30", 7: "15:30"
      };

      // 요일별 시트 열(Col) 구조 정의
      const scheduleLayout = [
        { day: "월", cols: [2,3,4,5,6,7,8] },
        { day: "화", cols: [9,10,11,12,13,14] },
        { day: "수", cols: [15,16,17,18,19,20,21] },
        { day: "목", cols: [22,23,24,25,26,27,28] },
        { day: "금", cols: [29,30,31,32,33,34] }
      ];

      window.onload = function() {
        google.script.run.withSuccessHandler(populateData).getInitialData();
      };

      function populateData(data) {
        window.appData = data;
        window.sheetUrl = data.sheetUrl; 
        
        const tSelect = document.getElementById('swapTeacher');
        const tChecks = document.getElementById('teacherCheckboxes');

        tSelect.add(new Option("선택하세요", "", true, true));
        document.querySelector('#swapTeacher option[value=""]').disabled = true;

        data.teachers.forEach(t => {
          tSelect.add(new Option(t.name, t.row));
          
          const div = document.createElement('div');
          div.className = "form-check mb-1";
          div.innerHTML = `<input class="form-check-input t-check" type="checkbox" value="${t.row}" id="chk${t.row}">
                           <label class="form-check-label text-dark" for="chk${t.row}">${t.name}</label>`;
          tChecks.appendChild(div);
        });

        // 교사 선택 시 시간표 렌더링 이벤트 등록
        tSelect.addEventListener('change', renderTimetable);
      }

      // ⭐ 오늘 날짜를 기준으로 이번 주 월~금 날짜 계산 함수
      function getWeekDates() {
        const now = new Date();
        const day = now.getDay();
        // 일요일(0)인 경우 지난주 월요일이 아닌 내일(월요일)로 계산 보정
        const diffToMonday = now.getDate() - day + (day === 0 ? -6 : 1);
        const monday = new Date(now.setDate(diffToMonday));
        
        const dates = [];
        for(let i=0; i<5; i++) {
          const d = new Date(monday);
          d.setDate(monday.getDate() + i);
          dates.push((d.getMonth() + 1) + '. ' + d.getDate() + '.');
        }
        return dates;
      }

      // ⭐ 선택한 교사의 요일별 시간표 탭을 동적으로 그리는 함수
      function renderTimetable() {
        const selectedRow = document.getElementById('swapTeacher').value;
        const container = document.getElementById('timetableContainer');
        const dayTabs = document.getElementById('dayTabs');
        const dayTabsContent = document.getElementById('dayTabsContent');
        
        // 시간표 렌더링 시 기존 교체 결과 지우기
        hideSwapResult();

        if (!window.appData || !selectedRow) {
          container.style.display = 'none';
          return;
        }

        const teacher = window.appData.teachers.find(t => t.row == parseInt(selectedRow));
        if (!teacher) return;

        const weekDates = getWeekDates();
        container.style.display = 'block';
        dayTabs.innerHTML = '';
        dayTabsContent.innerHTML = '';

        scheduleLayout.forEach((dayInfo, index) => {
          const isActive = index === 0 ? 'active' : '';
          const isShow = index === 0 ? 'show active' : '';
          const tabId = `day-${index}`;

          // 요일 탭 버튼 생성 (월~금 및 날짜)
          dayTabs.innerHTML += `
            <li class="nav-item" role="presentation">
              <button class="nav-link ${isActive} py-2" data-bs-toggle="pill" data-bs-target="#${tabId}" type="button" role="tab">
                <div class="fw-bold" style="font-size:1.1rem;">${dayInfo.day}</div>
                <div class="text-secondary" style="font-size:0.75rem;">${weekDates[index]}</div>
              </button>
            </li>
          `;

          // 해당 요일의 교시 리스트 생성
          let listHtml = '';
          dayInfo.cols.forEach((colNum, pIndex) => {
            const periodNum = pIndex + 1;
            const timeStr = periodTimes[periodNum] || "";
            const cellContent = teacher.schedule[colNum] || "";

            if (cellContent) {
              // 수업이 있는 경우 (버튼 클릭 시 교체 조회)
              listHtml += `
                <div class="d-flex align-items-center mb-2 p-2 rounded class-btn shadow-sm bg-white" style="cursor: pointer;" onclick="findSwaps(${selectedRow}, ${colNum}, '${cellContent}')">
                  <div class="me-3 text-center" style="width: 55px; border-right: 2px solid #e9ecef;">
                    <div class="fw-bold text-dark">${periodNum}교시</div>
                    <div class="text-muted" style="font-size: 0.7rem;">${timeStr}</div>
                  </div>
                  <div class="flex-grow-1 fw-bold text-primary fs-6 px-2">
                    ${cellContent}
                  </div>
                  <div class="text-muted small">
                    <span class="badge bg-primary rounded-pill">교체 찾기</span>
                  </div>
                </div>
              `;
            } else {
              // 공강인 경우 (버튼 비활성화 및 회색 처리)
              listHtml += `
                <div class="d-flex align-items-center mb-2 p-2 rounded free-slot">
                  <div class="me-3 text-center" style="width: 55px; border-right: 2px dashed #dee2e6;">
                    <div class="fw-bold">${periodNum}교시</div>
                    <div style="font-size: 0.7rem;">${timeStr}</div>
                  </div>
                  <div class="flex-grow-1 fw-bold fst-italic px-2">
                    공강
                  </div>
                </div>
              `;
            }
          });

          // 요일별 컨텐츠 패널에 추가
          dayTabsContent.innerHTML += `
            <div class="tab-pane fade ${isShow}" id="${tabId}" role="tabpanel">
              ${listHtml}
            </div>
          `;
        });
      }

      function openSheet() {
        if (window.sheetUrl) {
          window.open(window.sheetUrl, '_blank');
        } else {
          alert("시트 주소를 불러오는 중입니다. 잠시 후 다시 시도해주세요.");
        }
      }

      // ⭐ 시간표에서 수업을 클릭했을 때 바로 실행되는 함수
      function findSwaps(row, col, className) {
        document.getElementById('loader1').style.display = 'block';
        document.getElementById('result1').style.display = 'none';

        google.script.run.withSuccessHandler(function(res) {
          document.getElementById('loader1').style.display = 'none';
          const rBox = document.getElementById('result1');
          rBox.style.display = 'block';
          
          // 결과창 내부에 결과 텍스트 삽입 및 색상 변경
          rBox.innerHTML = `<div class="fw-bold mb-2 pb-2 border-bottom border-light">📌 [${className}] 교체 가능 내역</div><div id="resText1"></div>`;
          document.getElementById('resText1').innerText = res.message;
          
          rBox.className = res.success ? "result-box mt-3 bg-success text-white shadow-sm" : "result-box mt-3 bg-warning text-dark shadow-sm";
          
          // 결과창으로 스크롤 부드럽게 이동
          rBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }).runRecommendSwapsWeb(row, col);
      }

      // 교체 탭 전체 초기화 (교사 선택 + 결과 + 시트 색상)
      function resetSwapTab() {
        document.getElementById('swapTeacher').value = "";
        document.getElementById('timetableContainer').style.display = 'none';
        hideSwapResult();
      }

      function hideSwapResult() {
        document.getElementById('result1').style.display = 'none';
        document.getElementById('result1').innerHTML = '';
        google.script.run.runResetColorsWeb();
      }

      // 회의 시간 조회
      function findFreeSlots() {
        const checks = document.querySelectorAll('.t-check:checked');
        const selectedRows = Array.from(checks).map(c => c.value);
        
        if(selectedRows.length < 2) {
          alert("회의 시간을 맞출 2명 이상의 교사를 선택해주세요.");
          return;
        }

        document.getElementById('loader2').style.display = 'block';
        document.getElementById('result2').style.display = 'none';

        google.script.run.withSuccessHandler(function(res) {
          document.getElementById('loader2').style.display = 'none';
          const rBox = document.getElementById('result2');
          rBox.style.display = 'block';
          
          rBox.innerHTML = `<div class="fw-bold mb-2 pb-2 border-bottom border-light">📌 회의 시간 탐색 결과</div><div id="resText2"></div>`;
          document.getElementById('resText2').innerText = res.message;

          rBox.className = res.success ? "result-box mt-3 bg-info text-white shadow-sm" : "result-box mt-3 bg-warning text-dark shadow-sm";
          rBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }).runFindCommonFreeWeb(selectedRows);
      }

      // 회의 탭 전체 초기화 (체크박스 해제 + 결과 + 시트 색상)
      function resetFreeTab() {
        document.getElementById('result2').style.display = 'none';
        document.getElementById('result2').innerHTML = '';
        
        const allChecks = document.querySelectorAll('.t-check');
        allChecks.forEach(check => check.checked = false);
        
        google.script.run.runResetColorsWeb();
      }
    </script>
  </body>
</html>
